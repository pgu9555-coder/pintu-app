name: Deploy PintU to CloudBase

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - cloudbaserc.json
      - "cloudfunctions/**"
      - cloudbase-security-rules.json
      - cloudbase-function-security-rules.json
      - scripts/apply-cloudbase-security.cjs
      - scripts/apply-cloudbase-function-security.cjs
      - scripts/migrate-room-members.cjs
      - scripts/test-migrate-room-members.cjs
      - scripts/test-room-gateway.cjs
      - scripts/test-index-html.cjs
      - scripts/test-security-config.cjs
      - scripts/prepare-map-gateway-config.cjs
      - scripts/test-miniprogram-native.cjs
      - scripts/test-map-gateway.cjs
      - scripts/deployment-trigger.txt
      - "miniprogram-shell/**"
      - .github/workflows/deploy-cloudbase.yml
  workflow_dispatch:
    # Repository secret changes do not emit a push event; manually re-running
    # this workflow applies refreshed values without changing application code.
    inputs:
      run_membership_migration:
        description: "Run the one-time room membership backfill before deployment"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pintu-cloudbase-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy PintU production
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - name: Validate deployment secrets
        env:
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
        shell: bash
        run: |
          if [ -z "$TCB_SECRET_ID" ] || [ -z "$TCB_SECRET_KEY" ]; then
            echo "Missing TCB_SECRET_ID or TCB_SECRET_KEY in GitHub Actions secrets."
            exit 1
          fi

      - name: Detect optional map service secret
        id: map-secret
        env:
          AMAP_WEB_SERVICE_KEY: ${{ secrets.AMAP_WEB_SERVICE_KEY }}
        shell: bash
        run: |
          if [ -n "$AMAP_WEB_SERVICE_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "AMAP_WEB_SERVICE_KEY is not configured; mapGateway deployment will be skipped."
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p cloudbase-site
          cp index.html cloudbase-site/index.html

      - name: Install CloudBase CLI
        run: npm install --global @cloudbase/cli@3.7.0

      - name: Log in to Tencent CloudBase
        env:
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
        shell: bash
        run: |
          if [ -z "$TCB_SECRET_ID" ] || [ -z "$TCB_SECRET_KEY" ]; then
            echo "Missing TCB_SECRET_ID or TCB_SECRET_KEY in GitHub Actions secrets."
            exit 1
          fi
          tcb login --apiKeyId "$TCB_SECRET_ID" --apiKey "$TCB_SECRET_KEY"

      - name: Test room gateway access rules
        run: |
          node scripts/test-room-gateway.cjs
          node scripts/test-migrate-room-members.cjs
          node scripts/test-index-html.cjs
          node scripts/test-security-config.cjs
          node scripts/test-miniprogram-native.cjs
          node scripts/test-map-gateway.cjs

      - name: Install deployment dependencies
        run: npm install --no-save @cloudbase/manager-node@5.6.6 @cloudbase/node-sdk@3.18.3

      - name: Ensure database collections, indexes, and security rules
        env:
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
          CLOUDBASE_ENV_ID: pintu-d4g77ecn24b674fa0
          TCB_REGION: ap-shanghai
        run: node scripts/apply-cloudbase-security.cjs

      - name: Deploy room access gateway
        run: tcb fn deploy roomGateway --force --yes

      - name: Prepare map search deployment configuration
        if: ${{ steps.map-secret.outputs.available == 'true' }}
        env:
          AMAP_WEB_SERVICE_KEY: ${{ secrets.AMAP_WEB_SERVICE_KEY }}
        run: node scripts/prepare-map-gateway-config.cjs

      - name: Deploy map search gateway
        if: ${{ steps.map-secret.outputs.available == 'true' }}
        run: tcb fn deploy mapGateway --force --yes

      - name: Apply and verify function security rules
        env:
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
          CLOUDBASE_ENV_ID: pintu-d4g77ecn24b674fa0
          TCB_REGION: ap-shanghai
        run: node scripts/apply-cloudbase-function-security.cjs

      - name: Backfill room member access lists
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_membership_migration == true }}
        env:
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
          CLOUDBASE_ENV_ID: pintu-d4g77ecn24b674fa0
          RUN_ROOM_MEMBERSHIP_MIGRATION: "1"
        run: node scripts/migrate-room-members.cjs

      - name: Deploy index.html to production
        run: tcb hosting deploy ./cloudbase-site / -e pintu-d4g77ecn24b674fa0
